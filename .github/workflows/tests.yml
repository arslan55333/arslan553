name: tests

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - name: Install Chromium for Playwright (Windows)
        run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - name: Tests
        run: python -m pytest -q

  windows-setup-script:
    # Proves the double-click setup.bat really works on a clean Windows machine
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run setup.bat
        shell: cmd
        env:
          LEADENGINE_NO_PAUSE: "1"
        run: call setup.bat
      - name: Installed app answers
        shell: cmd
        run: .venv\Scripts\python -m leadengine stats
