[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadengine"
version = "0.1.0"
description = "Google Maps lead intelligence engine for US local service businesses"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
selenium = ["selenium>=4.20"]
dev = ["pytest>=8"]

[project.scripts]
leadengine = "leadengine.cli:app"

[tool.setuptools.packages.find]
include = ["leadengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
