[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "leadengine"
version = "0.1.0"
description = "Google Maps lead intelligence engine for US local service businesses"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "rich>=13",
    "typer>=0.12",
    "playwright>=1.45",
    "beautifulsoup4>=4.12",
    "dnspython>=2.6",
    "cryptography>=42",
    "anthropic>=1.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
selenium = ["selenium>=4.20"]
sheets = ["gspread>=6.0"]
dev = ["pytest>=8"]

[project.scripts]
leadengine = "leadengine.cli:app"

[tool.setuptools.packages.find]
include = ["leadengine*"]

[tool.setuptools.package-data]
leadengine = ["data/*.csv.gz", "data/*.md", "ui/templates/*.html", "ui/static/*", "preview/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
