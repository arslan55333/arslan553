<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}LeadEngine{% endblock %} · LeadEngine</title>
<link rel="stylesheet" href="/static/app.css"><script src="/static/htmx.min.js" defer></script></head>
<body><header class="top"><div class="logo">Lead<span>Engine</span></div>
<nav>{% set p = request.url.path %}
<a href="/" class="{{ 'active' if p == '/' }}">Dashboard</a>
<a href="/run" class="{{ 'active' if p.startswith('/run') }}">New scan</a>
<a href="/ads" class="{{ 'active' if p.startswith('/ads') }}">Ads finder</a>
<a href="/rank" class="{{ 'active' if p.startswith('/rank') }}">Rank map</a>
<a href="/leads" class="{{ 'active' if p.startswith('/leads') }}">Leads</a>
{% set na = unseen_alerts() %}<a href="/alerts" class="{{ 'active' if p.startswith('/alerts') }}">Alerts{% if na %} <span class="nbadge">{{ na }}</span>{% endif %}</a>
<a href="/outbox" class="{{ 'active' if p.startswith('/outbox') }}">Outbox</a>
<a href="/jobs" class="{{ 'active' if p.startswith('/jobs') }}">Jobs</a>
<a href="/credits" class="{{ 'active' if p.startswith('/credits') }}">Credits</a>
<a href="/settings" class="{{ 'active' if p.startswith('/settings') }}">⚙ Settings</a></nav></header>
<main>{% block body %}{% endblock %}</main></body></html>
