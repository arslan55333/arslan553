# LeadEngine settings (no secrets here; secrets live in .env)

[general]
default_provider = "serpapi"   # used by `search`; `discover` uses [discovery].provider

# How long cached data stays "fresh" before we pay for it again (days)
[cache]
search = 14        # same keyword + ZIP + provider
website = 30       # website checks (Phase 4)
emails = 30        # email extraction (Phase 3)
ads = 7            # ads detection (Phase 5)
geocode = 365      # ZIP -> coordinates (fallback only; ZIPs are bundled offline)
domain = 30        # per-domain MX / catch-all results
activity = 14      # review dates / owner replies / claimed / photos from the place page
paid_place = 30    # paid API lookups used to fill missing phone/website
default = 30

[http]
timeout_seconds = 20
max_retries = 3
backoff_base_seconds = 1.0   # waits 1s, 2s, 4s ... between retries
concurrency = 5              # max parallel requests
delay_seconds = 0.0          # extra pause after every request

# Hybrid discovery: free browser scraping over an adaptive grid, paid APIs only
# for shortlisted leads that are still missing data.
[discovery]
provider = "playwright"
initial_cell_km = 6       # first grid cell size; dense cells split automatically
max_depth = 2             # how many times a saturated cell may split (6 km -> 3 km -> 1.5 km)
max_cells = 40            # safety cap on searches per run
concurrency = 3           # cells searched in parallel
area_margin = 0.15        # search a bit beyond the ZIP edge (ads/businesses near the border)
towns = false             # also search "keyword in <town>" for towns in/around the ZIP
shortlist_min_reviews = 20
shortlist_min_rating = 4.0
check_scope = "all"       # all = deep-check every business found (dense cities!) | area = only inside the ZIP
max_checks = 60           # cap on deep checks per ZIP (best-reviewed first)
activity = true           # open shortlisted place pages: review dates, owner replies, claimed, photos
fill_missing = true       # use the paid provider only for shortlisted leads missing phone/website
fill_provider = "serpapi"
max_fill = 25             # max paid lookups per run
emails = true             # crawl shortlisted websites for emails (see [emails])
website = true            # score shortlisted websites 0-100 (see [website])
seo = true                # local SEO score for shortlisted leads (on-page + Google profile)
ads = true                # detect Google Ads / LSA for shortlisted leads (see [ads])

# Email finding (Phase 3)
[emails]
max_pages = 8             # pages per website (homepage + contact/about/team/privacy ...)
timeout_seconds = 12
concurrency = 5           # websites crawled in parallel
facebook = true           # also read the business's Facebook page if the site links it
guess_patterns = true     # add owner-name guesses (first@, first.last@ ...) marked as GUESSED
verify = "mx"             # none | mx | smtp | reacher   (smtp needs port 25 - use a VPS; or run Reacher)
verify_guesses = true
smtp_helo = ""            # your sending domain, required for verify = "smtp"
smtp_from = ""            # e.g. verify@yourdomain.com
smtp_timeout_seconds = 10
reacher_url = ""          # e.g. http://your-vps:8080 (self-hosted Reacher)
shortlist_only = true     # `emails` command: only businesses passing the discovery shortlist

# Website Score (Phase 4)
[website]
timeout_seconds = 15
concurrency = 3           # websites analysed in parallel
pagespeed = true          # Google PageSpeed Insights (add PAGESPEED_API_KEY in .env for volume)
wayback = true            # Wayback Machine: when the site first appeared
screenshot = true         # full-page + mobile screenshots with Playwright (data/screenshots/)
vision = false            # AI design review of the screenshot (uses [llm]); costs API credits
shortlist_only = true

# Firecrawl (firecrawl.dev, key FIRECRAWL_API_KEY): reads JavaScript-only / bot-protected sites, lists every page
[firecrawl]
mode = "smart"            # off | fallback (only when a site can't be read) | smart (+ page list for SEO, 1 credit/site)
                          # | full (+ services, owner, years from the site, ~5 credits/site)
max_per_run = 300         # most credits one run may spend
timeout_ms = 30000

# Money insights on lead pages / reports (estimates; niche averages in leadengine/data/niches.csv)
[money]
ad_budget = 1500          # assumed monthly Google Ads budget of a local business, for the "ad waste" estimate
job_value = 0             # your own average job value in $ (0 = use the niche average)

# Google reviews audit: negative reviews, unanswered ones (+ suggested replies), reply rate, review speed, themes
[reviews]
scope = "targets"         # which scanned businesses get it: targets (ads + weak/no site) | shortlist | off
source = "auto"           # auto = free browser, SerpAPI only if Google Maps won't show the reviews | browser | serpapi
serpapi_max = 10          # most SerpAPI credits one run may spend on reviews (2 per business)
ai_summary = true         # 2-sentence summary of complaints when an AI key is set

# Google Ads detection (Phase 5)
[ads]
serp_provider = "auto"         # auto = free browser, SerpAPI only when Google shows a captcha | playwright | serpapi | none
paid_fallback_max = 10         # most SerpAPI credits one run may use as captcha fallback
gtm = true                     # read the site's Google Tag Manager container for hidden AW- tags
transparency_free = true       # Ads Transparency Center, free: by website domain, or by business NAME when there is
                               # no website (finds advertisers who only run LSA / Maps / call-only ads)
transparency = false           # Ads Transparency Center via SerpAPI (1 credit per business)
timeout_seconds = 15
# Ads finder (sweep): many searches -> everyone paying Google in your area
sweep_variations = 6           # search phrases per place (keyword, "near me", "emergency ...", Google ideas)
sweep_delay_min = 4            # seconds between live Google searches (random in min..max, avoids captchas)
sweep_delay_max = 9
sweep_suggest = true           # use Google autocomplete for real phrases people search
sweep_landing = true           # audit each advertiser's ad landing page
sweep_deep = true              # also website score + emails for every advertiser found
transparency_browser = false   # read Google Ads Transparency Center in the free browser (experimental)

# Opportunity Score (Phase 6): weights are points out of 100 (they are re-normalised if a signal is unknown)
[opportunity]
hot = 70                  # score >= hot -> Hot
warm = 50                 # score >= warm -> Warm, else Cold
min_rating = 3.5          # below -> Skip
modern_site = 80          # website score >= this -> Skip (nothing to sell)
reviews_full = 300        # review count that earns full reputation points
require_ads_for_hot = true  # Hot only when there is proof of ad spend (Active / Likely / LSA)

[opportunity.weights]
reputation = 25           # rating + review count
activity = 15             # review recency/velocity + owner replies
ads = 25                  # spends on Google Ads / LSA
website = 25              # weak, old or missing website
reachability = 10         # verified email / phone
seo = 10                  # weak local SEO (on-page + Google profile)

# Preview landing pages (Phase 8)
[preview]
brand_name = ""           # your agency name, shown in the preview banner and footer
brand_url = ""
brand_email = ""
style = "auto"            # auto (rotates) | clean | bold | warm
use_ai = true             # AI-written copy via [llm]; false = safe template copy
deploy = "none"           # none | netlify | cloudflare
base_domain = ""          # e.g. "previews.youragency.com" -> acme-dallas-12.previews.youragency.com
                          # (point a wildcard DNS record *.previews.youragency.com at your host first)

# Cold email drafts (Phase 9). Drafts only - nothing is sent unless you turn on [outreach.sending]
# AND approve each email yourself.
[outreach]
sender_name = ""          # your name, used in the sign-off
agency = ""               # empty = [preview] brand_name
sender_email = ""         # e.g. you@getacme-web.com - use a separate outreach domain, not your main one
reply_to = ""
physical_address = ""     # REQUIRED by CAN-SPAM before anything can be sent (street or PO box)
unsubscribe_line = "Not interested? Reply \"unsubscribe\" and I won't email you again."
offer = ""                # one line about what you do, e.g. "I build fast, mobile-first sites for local trades."
use_ai = true             # AI-written drafts via [llm]; false = template drafts
name_competitors = false  # true = mention the stronger competitor by name
followup_days = [3, 7, 14]
max_words = 150
imap_host = ""            # e.g. imap.gmail.com - lets `outreach push --imap` save drafts in your Drafts folder
imap_drafts_folder = "[Gmail]/Drafts"

[outreach.sending]
enabled = false           # opt-in. Even when true, only emails you approved are sent
smtp_host = ""            # e.g. smtp.gmail.com
smtp_port = 587
max_per_day = 30          # stay low on a new domain (warm it up)
min_delay_seconds = 120   # pause between sends (+ random jitter)
attach_screenshot = false
allowed_from_domains = [] # e.g. ["getacme-web.com"] - refuses to send from any other domain

# Rank heatmap (geo-grid): Google Maps searched from every point of an N x N grid
[rank]
size = 7                  # 7 x 7 = 49 map searches (5 = faster, 9 = more detail)
spacing_km = 1.0          # distance between points (a ZIP scan picks this from the ZIP size)
depth = 20                # positions tracked per point
concurrency = 2           # parallel map searches
map_tiles = true          # OpenStreetMap background on the heatmap

# Weekly watch: re-run saved Ads-finder searches and alert on businesses that START advertising
[alerts]
auto = true               # while the dashboard (start.bat) is open, run due watches automatically
check_every_minutes = 30

# Dashboard
[ui]
online_suggestions = true # keyword ideas from Google autocomplete + neighbourhoods from OpenStreetMap (free)

# Exports
[export]
google_credentials_file = ""   # service-account JSON for Google Sheets export (pip install gspread)

# AI provider used by design review, preview copy and outreach drafts
[llm]
provider = "claude"       # claude | gemini | groq | ollama
model = ""                # empty = provider default (claude-opus-5-5, gemini-2.5-flash, ...)
effort = "medium"         # Claude effort: low | medium | high
fallbacks = true          # Claude: re-run a declined request on Anthropic's recommended model

[proxy]
max_failures = 3          # failures before a proxy is benched
ban_seconds = 600

# cost_per_call_usd is a list-price estimate used for the credits panel.
# Check current pricing before relying on it.
[providers.playwright]
cost_per_call_usd = 0.0
headless = true
contexts = 3              # parallel browser contexts
details = "missing"       # open place pages during search: "missing" fields only | "all" | "none"
scroll_pause_s = 1.2
max_scrolls = 40
stale_scrolls = 4
timeout_ms = 20000
max_attempts = 3
block_resources = ["image", "media", "font"]
# executable_path = ""    # use a specific Chrome/Chromium
# channel = "chrome"      # or use installed Google Chrome

[providers.serpapi]
cost_per_call_usd = 0.015    # paid plans ~ $75 / 5,000 searches
monthly_free_calls = 250     # SerpAPI free plan

[providers.firecrawl]
cost_per_call_usd = 0.00083  # Hobby plan ~ $16 / 19,000 credits (1 credit = 1 page or 1 page list)
monthly_free_calls = 0

[providers.google_places]
cost_per_call_usd = 0.035    # Text Search Enterprise SKU (phone/website/rating fields)
monthly_free_calls = 1000

[providers.osm]
cost_per_call_usd = 0.0
endpoint = "https://overpass-api.de/api/interpreter"

[providers.nominatim]
cost_per_call_usd = 0.0
endpoint = "https://nominatim.openstreetmap.org/search"

[providers.selenium]
cost_per_call_usd = 0.0
headless = true
